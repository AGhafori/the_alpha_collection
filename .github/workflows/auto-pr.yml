name: Open Feature Pull Request

on:
  push:
    branches:
      - '**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-pr:
    if: github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Open a pull request if needed
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const base = context.payload.repository.default_branch;
            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${branch}`,
              base,
              state: 'open',
              per_page: 1
            });

            if (existing.length > 0) {
              core.info(`Pull request already exists: ${existing[0].html_url}`);
              return;
            }

            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${base}...${branch}`
            });

            if (comparison.ahead_by === 0 || comparison.files.length === 0) {
              core.info('No changes to propose against the default branch.');
              return;
            }

            const subject = context.payload.head_commit?.message.split('\n')[0].trim() || branch;
            const { data: pullRequest } = await github.rest.pulls.create({
              owner,
              repo,
              head: branch,
              base,
              title: subject.slice(0, 256),
              body: `Automatically opened after a push to \`${branch}\`.\n\nPlease review before merging.`,
              maintainer_can_modify: true
            });
            core.info(`Created pull request: ${pullRequest.html_url}`);